<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bijoy Malakar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-container">
            <div class="logo-area"><h1>BIJOY MALAKAR</h1></div>
            <button class="hamburger-btn" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="about.html">Biography</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Mobile Sidebar -->
    <div class="overlay" id="overlay"></div>
    <div class="mobile-sidebar" id="mobileSidebar">
        <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
        <div class="sidebar-links">
            <a href="index.html">Home</a>
            <a href="about.html">Biography</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main style="margin-top: 90px; padding-bottom: 60px;">
        <div class="container text-center">
            
            <h2 class="section-title">Photo & Video Gallery</h2>
            <div class="section-line"></div>
            
            <div class="grid-3" style="margin-top: 40px;">
                <!-- Gallery Item 1 -->
                <div class="card">
                    <img src="assets/images/gallery-1.jpg" alt="Event 1" style="width: 100%; height: 250px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/400x300?text=Upload+Image+1'">
                    <div style="padding: 15px;"><p style="font-weight: 600;">Public Meeting at Ram Krishna Nagar</p></div>
                </div>
                
                <!-- Gallery Item 2 -->
                <div class="card">
                    <img src="assets/images/gallery-2.jpg" alt="Event 2" style="width: 100%; height: 250px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/400x300?text=Upload+Image+2'">
                    <div style="padding: 15px;"><p style="font-weight: 600;">Development Project Inauguration</p></div>
                </div>
                
                <!-- Gallery Item 3 -->
                <div class="card">
                    <img src="assets/images/gallery-3.jpg" alt="Event 3" style="width: 100%; height: 250px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/400x300?text=Upload+Image+3'">
                    <div style="padding: 15px;"><p style="font-weight: 600;">Interacting with Local Citizens</p></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer style="background: var(--dark-text); color: white; padding: 30px 0; text-align: center;">
        <p style="font-weight: bold; margin-bottom: 10px;">Bijoy Malakar | Bharatiya Janata Party (BJP)</p>
        <p>&copy; 2026 Bijoy Malakar. All Rights Reserved.</p>
    </footer>

    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
